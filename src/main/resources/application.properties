# ----------------- LOCAL SECRETS -----------------
# Load KEY=VALUE pairs from ./.env however the app is started (run.ps1, mvnw, IDE).
# Real environment variables still take precedence; missing file is ignored (Docker/Render).
spring.config.import=optional:file:.env[.properties]

# ----------------- DATABASE (MySQL) -----------------
# Locally: uses MySQL on localhost:3306
# On Render: set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER in Environment tab
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/todo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2205}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.MariaDBDialect}


# Connection Pool Settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# ----------------- SERVER -----------------
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ----------------- EMAIL -----------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:khuswanthraojadav@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# ----------------- EXTERNAL APIS -----------------
google.fonts.api.key=${GOOGLE_FONTS_API_KEY:}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ----------------- GOOGLE CALENDAR -----------------
# Uses GOOGLE_CALENDAR_CLIENT_ID/SECRET, falling back to the login client above. In Google Cloud Console:
#   1. Enable "Google Calendar API"
#   2. Add GOOGLE_CALENDAR_REDIRECT_URI to the OAuth client's "Authorized redirect URIs"
#   3. Add scope .../auth/calendar.events to the OAuth consent screen
google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
google.calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/calendar/google/callback}
# Public HTTPS URL Google posts push notifications to. Leave empty to disable Calendar -> Task sync
# (Task -> Calendar still works). Locally, expose port 8080 with a tunnel such as ngrok.
google.calendar.webhook-url=${GOOGLE_CALENDAR_WEBHOOK_URL:}

# ----------------- UPLOAD LIMITS -----------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-post-size=10MB
server.tomcat.max-swallow-size=10MB

